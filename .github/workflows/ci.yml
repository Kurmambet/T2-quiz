name: CI/CD

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create CI backend environment
        run: |
          cat > backend/.env <<'EOF'
          APP_NAME=T2 Quiz Rooms API
          APP_ENV=testing
          DEBUG=false
          APP_SECRET_KEY=ci-only-not-a-production-secret
          API_V1_PREFIX=/api/v1

          DATABASE_URL=postgresql+asyncpg://t2_quiz:t2_quiz_dev_password@db:5432/t2_quiz
          DATABASE_POOL_SIZE=5
          DATABASE_MAX_OVERFLOW=5
          SQL_ECHO=false

          REDIS_URL=redis://redis:6379/0

          REALTIME_PRESENCE_TTL_SECONDS=45
          REALTIME_HEARTBEAT_INTERVAL_SECONDS=15

          CORS_ORIGINS=["http://localhost"]
          EOF

      - name: Build and start development stack
        run: docker compose -f compose.dev.yml up -d --build

      - name: Wait for API readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/ready; then
              exit 0
            fi

            sleep 2
          done

          echo "API did not become ready in time."
          exit 1

      - name: Run backend checks
        run: make check

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose -f compose.dev.yml logs --no-color

      - name: Stop development stack
        if: always()
        run: docker compose -f compose.dev.yml down -v

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend-vite

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-vite/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build production frontend
        run: npm run build

  deploy:
    name: Deploy production
    needs:
      - backend
      - frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://hushme.fun
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy with Docker Compose
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'bash -s' <<'EOF'
          set -Eeuo pipefail

          cd /opt/t2-quiz/T2-quiz

          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          docker compose -f compose.prod.yml build
          docker compose -f compose.prod.yml up -d --remove-orphans

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/ready; then
              docker compose -f compose.prod.yml ps
              exit 0
            fi

            sleep 2
          done

          echo "API did not become ready after deploy."
          docker compose -f compose.prod.yml logs --tail=150 migrate api frontend
          exit 1
          EOF

      - name: Verify public API
        run: |
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error \
              https://hushme.fun/api/v1/quiz-templates > /dev/null; then
              exit 0
            fi

            sleep 2
          done

          echo "Public API health verification failed."
          exit 1
