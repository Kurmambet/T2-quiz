services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: t2-quiz-api-dev
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    container_name: t2-quiz-db-dev
    environment:
      POSTGRES_DB: t2_quiz
      POSTGRES_USER: t2_quiz
      POSTGRES_PASSWORD: t2_quiz_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U t2_quiz -d t2_quiz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: t2-quiz-redis-dev
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
